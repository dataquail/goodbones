name: NX release

on:
  push:
    branches:
      - main
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sets the base and head SHAs for the nx affected commands in CI
        uses: nrwl/nx-set-shas@v5

      - name: Lint affected projects
        run: pnpm exec nx affected -t lint --base=origin/main --head=${{ github.event.pull_request.head.sha || github.sha }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sets the base and head SHAs for the nx affected commands in CI
        uses: nrwl/nx-set-shas@v5

      - name: Test affected projects
        run: pnpm exec nx affected -t test --base=origin/main --head=${{ github.event.pull_request.head.sha || github.sha }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck affected projects
        run: pnpm exec nx affected -t check --base=origin/main --head=${{ github.event.pull_request.head.sha || github.sha }}

  # The end-to-end suite: generated repositories run through the built bin and
  # through oxlint loading the built plugin. It runs here, on main, and not on
  # pull requests — it takes several minutes, and what it catches (a plugin
  # loaded by a dynamic `import()` is not an edge Nx sees) is caught before
  # anything ships: `release` needs it, so a red suite is a release that does
  # not happen. Never `nx affected`, and it builds everything first.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the end-to-end suite
        run: pnpm exec nx run @goodbones/e2e:e2e

  release:
    needs: [lint, test, check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - name: Checkout the main branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This path releases packages the registry already knows. A package that
      # has never been published goes through the First Publish workflow, on
      # purpose and with a dry run first — `fallbackCurrentVersionResolver:
      # "disk"` would otherwise let the first `feat:` commit touching a new
      # package version, tag and release it with no one having looked at the
      # tarball. Private packages are out for the same reason `nx release`
      # would exclude them by default: `release.projects` is set explicitly
      # here, which turns that default off.
      #
      # Leaving an unpublished package out of `--projects` is NOT enough, and
      # believing it was is what broke @goodbones/campaigns. `updateDependents:
      # "auto"` versions every workspace package that depends on something in
      # the release, whether or not it was named — so a package that is merely
      # skipped here still gets versioned, tagged and GitHub-released. A
      # never-published package on `0.1.0-beta.0` takes a plain patch bump to a
      # stable `0.1.0`, with no preid and no publish, and First Publish then
      # refuses it because a release tag exists. The version number is burned
      # and the fix is an unpublish.
      #
      # So this is a gate, not a filter: while any package under `packages/` is
      # missing from the registry, no release runs at all. The window is exactly
      # "a new package has landed on main and First Publish has not run yet",
      # and the way through it is to run First Publish, not to merge more.
      - name: Find the packages the registry already knows
        id: releasable
        run: |
          releasable=""
          unpublished=""
          for manifest in packages/*/package.json; do
            [ -f "$manifest" ] || continue
            name=$(node -p "JSON.parse(require('fs').readFileSync('$manifest','utf8')).name")
            private=$(node -p "JSON.parse(require('fs').readFileSync('$manifest','utf8')).private === true")
            if [ "$private" = "true" ]; then
              echo "  - $name is private; skipped"
            elif npm view "$name" version >/dev/null 2>&1; then
              echo "  - $name is on the registry; releasable"
              releasable="${releasable:+$releasable,}$name"
            else
              echo "  - $name has never been published"
              unpublished="${unpublished:+$unpublished, }$name"
            fi
          done

          if [ -n "$unpublished" ]; then
            {
              echo "::error::Refusing to release: $unpublished has never been published."
              echo ""
              echo "  \`updateDependents: auto\` would version and tag it anyway, as a stable"
              echo "  version with no preid and no publish — and once that tag exists the First"
              echo "  Publish workflow refuses the package and the version number is burned."
              echo ""
              echo "  Run the **First Publish** workflow for: $unpublished"
              echo "  Then re-run this job. Nothing was versioned, tagged or published."
            } >&2
            exit 1
          fi

          echo "projects=${releasable}" >> "$GITHUB_OUTPUT"
          [ -n "$releasable" ] || echo "Nothing to release."

      - name: Build all packages for release
        if: steps.releasable.outputs.projects != ''
        run: pnpm exec nx run-many -t build --projects='packages/*'

      - name: Run nx release
        if: steps.releasable.outputs.projects != ''
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          npx nx release --skip-publish --projects="${{ steps.releasable.outputs.projects }}"
