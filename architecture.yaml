# yaml-language-server: $schema=https://dataquail.github.io/goodbones/schema/architecture.schema.json
#
# The architecture policy: every boundary in this monorepo, as one manifest.
#
# It reads like a directory listing — a key ending in `/` is a folder, anything
# else is a file — and everything the architecture says about a part of the tree
# is written at that part of the tree: what it may import, who may import it,
# which names it may declare, and which siblings its files owe.
#
# Patterns are globs over repo-relative paths, matched against FULLY RESOLVED
# targets:
#
#   *          part of one path segment          {name}   captures one segment
#   **         any number of segments            [A-Z]    a character class
#   a/**       `a` itself as well as a/b/c       |        several patterns, one node
#
# Every glob is quoted: `*` opens a YAML alias, `@` and `` ` `` may not begin a
# bare word, and a quoted string is a string whatever it contains.
#
# The default is tight. A folder admits only the children it lists; a file may
# import only what it or an ancestor allows. Laxity is opted into by name:
# `reset` drops inherited allowances, `unrestricted` says a tier has no
# allowlist yet, `layout: open` says a folder does not enumerate its files.
#
# Every rule this compiles to carries a probe it must report, generated from the
# node's own path. The plugin refuses to load if any rule fails its own — a rule
# that has drifted into matching nothing is the failure this whole apparatus
# exists to prevent.
#
# This repository publishes the packages that read this file, so the policy is
# also their largest test: a change that breaks lowering breaks the lint run
# here first.

# Where a repository adopting this policy records the violations it is
# carrying. This one has none, so the file is absent — and `architecture
# baseline` would write an empty list rather than a place to hide.
baseline: .architecture-baseline.json

# Where each campaign below keeps its ledger: `<ledger>/<id>.json`, one file
# per campaign, so two pull requests paying down different campaigns never
# conflict, and finishing one is deleting its file.
ledger: .architecture-campaigns

resolve:
  # Only `packages/` is policed. The docs site is Astro, whose `astro:*`
  # virtual modules resolve to nothing on disk, and a scope that cannot
  # resolve its own imports would report noise rather than architecture.
  scopes:
    - files: "^packages/"
      language: typescript
      options: { tsconfig: tsconfig.resolve.json }
  # An import nobody can resolve is an import no rule can police. Loud by
  # default; anything listed here needs a reason next to it.
  unresolved: error
  ignoreUnresolved: []

aliases:
  "~": packages
  "@core": packages/core/src
  "@ts": packages/typescript/src
  "@cli": packages/cli/src
  "@ox": packages/oxlint/src
  "@ag": packages/ast-grep/src
  "@camp": packages/campaigns/src
  "@br": packages/browser/src

# Which exported names may cross which edges — the family a path rule cannot
# express, because every importer of a module resolves to the same file.
exports:
  - name: live-adapters-at-the-composition-root
    message: "A live adapter is constructed once, where a host is composed. Everything else takes the port it satisfies, or the fake — which is what lets it be tested without a file system, a parser or a resolver."
    module:
      - "@core/infrastructure/file-system-live.ts"
      - "@core/index.ts"
      - "@ts/extractor.ts"
      - "@ts/resolver.ts"
      - "@ts/index.ts"
      - "@camp/infrastructure/report-source-live.ts"
      - "@camp/modules/*/infrastructure/repositories/*.repository-live.ts"
      - "@camp/modules/*/infrastructure/clients/*.client-live.ts"
      - "@camp/index.ts"
      - "@ag/matcher.ts"
      - "@ag/index.ts"
    symbols:
      - makeFileSystemLive
      - makeModuleResolverLive
      - makeFactExtractorLive
      - makeReportSourceLive
      - makeObjectiveLedgersRepositoryLive
      - makeSectorRecordsRepositoryLive
      - makePlansRepositoryLive
      - makeGitClientLive
      - makeBaseSidesClientLive
      - makeMeasureCommandsClientLive
      - makeWorkspaceClientLive
      - astGrepMatcher
    # The three hosts' composition roots, and the hosts' campaigns glue,
    # which a root loads only when the family is installed; the barrels that
    # re-export them; the pack, which assembles its own extractor and
    # resolver; and the campaigns extension, which builds the ledgers'
    # repositories over the host's file system, and the clients the verbs
    # read other programs through, as the family's composition point inside
    # `loadPolicy`.
    except:
      - "@cli/config-loader.ts"
      - "@cli/campaigns/live.ts"
      - "@ox/config-loader.ts"
      - "@ox/campaigns/live.ts"
      - "@br/server/compose.ts"
      - "@br/server/campaigns/live.ts"
      - "@camp/load/extension.ts"
      - "@core/index.ts"
      - "@ts/index.ts"
      - "@ag/index.ts"
      - "@camp/index.ts"
      - "**/*.test.ts"
    probe:
      source: 'import { makeFileSystemLive } from "./infrastructure/file-system-live.js";'
      symbol: makeFileSystemLive

  - name: language-packs-at-the-composition-root
    message: "A language pack is constructed where a host is composed, and handed down as the `Language` port. Nothing in between names TypeScript — which is what lets a second language be added without editing the core."
    module: "@ts/index.ts"
    symbols: [typescriptLanguage]
    except:
      - "@cli/config-loader.ts"
      - "@ox/config-loader.ts"
      - "@br/server/compose.ts"
      - "**/*.test.ts"
    probe:
      source: 'import { typescriptLanguage } from "@goodbones/typescript";'
      symbol: typescriptLanguage

  - name: name-what-you-take
    message: "Name what you take from a sibling module. A namespace import or an `export *` takes every export at once, hides which are used, and launders a restricted name past every rule about it."
    module: "~/*/src/**"
    kinds: [namespace]
    # A composition root loads an optional peer through `importOptional`, and
    # a dynamic `import()` takes the module whole by construction.
    except:
      - "@cli/config-loader.ts"
      - "@ox/config-loader.ts"
      - "@br/server/compose.ts"
    probe:
      source: 'import * as imports from "./core/imports.js";'
      symbol: "*"

# Ratchets on the policy itself. No tier here says "not tightened yet", and
# the ceilings say none may start to without this line changing. The floors
# are the reach `architecture coverage` reported when they were written.
limits:
  unrestricted: 0
  partial: 0
  # Every folder here is `layout: open`, so structure is 0% enumerated and
  # states no floor. The rest are the numbers on the day they were written:
  # 2026-09-15, after the campaigns family and its matcher package landed —
  # surface 104/109 (every file under a `src/`; the five
  # `vitest.config.ts` are the remainder), graph 64/109 (every non-test file
  # under a `src/`). Members was raised on 2026-10-23, when the CLI's `src/`
  # took the rule the core's carries: 171/233 (every file under the core's
  # and the CLI's `src/`, neither of which prints or exits). A campaign joins
  # no coverage row: its reach is its scope.
  coverage: { imports: 1, members: 0.73, surface: 0.95, graph: 0.57 }
  # The same reach as a count, which deleting files cannot move: no file is
  # outside every import allowlist. The other families keep their fractions
  # until there is a reason to hold them by count.
  unreached: { imports: 0 }
  # Ceilings on what `architecture conformance` measures, at the numbers on
  # 2026-09-17: no file is outside every family, no allowlist selects
  # nothing, and five allowances are unused — `architecture conformance`
  # names them; four since 2026-10-23, when the CLI's unused allowance of the
  # core's fakes was deleted. Lower a ceiling when the number falls; never raise one to
  # make a red run green. The fix is deleting the allowance, reaching the
  # file, or moving it under a node.
  conformance: { residue: 0, vacant: 0, slack: 4, concentration: 0 }

# The shape of the whole graph — evaluated by `architecture check`, which
# is the one adapter that sees every file at once.
graph:
  cycles:
    - name: no-cycles
      message: "These files import each other, directly or through others. A cycle is a module boundary that does not exist."
      within: "~/*/src/**"
      withinNot: "**/*.test.ts"

  orphans:
    - name: no-dead-modules
      message: "Nothing imports this file. A module nothing reaches is either dead, or an entry point this policy has not listed."
      within: "~/*/src/**"
      withinNot: "**/*.test.ts"
      entry:
        - "@core/index.ts"
        - "@core/testing.ts"
        - "@ts/index.ts"
        - "@ag/index.ts"
        - "@camp/index.ts"
        - "@camp/testing.ts"
        - "@cli/main.ts"
        - "@ox/plugin.ts"
        - "@br/index.ts"
        - "@br/main.ts"
        # The page's island, mounted by an `.astro` file the walk does not see.
        - "@br/app/components/Browser.tsx"

  reach:
    - name: pure-tiers-reach-no-adapter
      message: "The pure tiers — domain, ports, core, manifest, load — reach no live implementation, no language pack, no syntax matcher and no host, through any number of hops. That is what makes them testable without one."
      from:
        - "@core/domain/**"
        - "@core/ports/**"
        - "@core/core/**"
        - "@core/manifest/**"
        - "@core/load/**"
      fromNot: "**/*.test.ts"
      to:
        - "@core/infrastructure/file-system-live.ts"
        - "@core/infrastructure/walk.ts"
        - "@core/infrastructure/manifest-file.ts"
        - "@ts/**"
        - "@ag/**"
        - "@camp/**"
        - "@cli/**"
        - "@ox/**"
        - "@br/**"

    # The one line that proves the decoupling held: nothing in the core
    # reaches TypeScript, or either host, through any number of hops.
    - name: core-reaches-no-other-package
      message: "The core reaches no other package. A second language is a second pack that depends on the core; the core depends on none of them."
      from: "@core/**"
      fromNot: "**/*.test.ts"
      to: ["@ts/**", "@ag/**", "@camp/**", "@cli/**", "@ox/**", "@br/**"]

    # The line that proves THIS decoupling held: the core does not know the
    # campaigns family exists, and the campaigns family knows no language, no
    # matcher and no host. It is a family over the core, exactly as a second
    # one would be.
    - name: campaigns-reaches-only-the-core
      message: "The campaigns family reaches the core and nothing else in this repository. It is a family the core does not own — composed by a host as a `PolicyExtension` — so a second such family is a second package that depends on the core, and on none of its peers."
      from: "@camp/**"
      fromNot: "**/*.test.ts"
      to: ["@ts/**", "@ag/**", "@cli/**", "@ox/**", "@br/**"]

    # The campaigns family's own hexagon: its pure tiers reach no live adapter
    # of its own, for the reason the core's do not reach the core's.
    - name: campaigns-pure-tiers-reach-no-adapter
      message: "The campaigns family's pure tiers — domain, ports, core, manifest — reach no live implementation, no module's adapters and no use-case, through any number of hops. That is what makes them testable without a file system, a git repository or another program."
      from:
        - "@camp/domain/**"
        - "@camp/ports/**"
        - "@camp/core/**"
        - "@camp/manifest/**"
      fromNot: "**/*.test.ts"
      to:
        - "@camp/infrastructure/campaign-functions.ts"
        - "@camp/infrastructure/report-source-live.ts"
        - "@camp/modules/*/infrastructure/**"
        - "@camp/modules/*/use-cases/**"

    # A module's domain is the model: it reaches no adapter of its own module
    # or any other, and none of the host glue, through any number of hops.
    - name: campaigns-domain-reaches-no-adapter
      message: "A module's domain transitively reaches an adapter. The domain names its own aggregates, the core's barrel and, until this package has a kernel, the old pure tiers; a route from it to an infrastructure/ adapter, the extension, a use-case or a presenter means a file on the route has widened past what the domain may know."
      from: "@camp/modules/*/domain/**"
      fromNot: "**/*.test.ts"
      to:
        - "@camp/modules/*/infrastructure/**"
        - "@camp/infrastructure/campaign-functions.ts"
        - "@camp/infrastructure/report-source-live.ts"
        - "@camp/load/**"
        - "@camp/modules/*/use-cases/**"
        - "@camp/presentation/**"

    # A use-case loads through ports it is handed — the repositories and
    # clients on the policy — and never through an adapter it reaches.
    - name: campaigns-use-cases-reach-no-adapter
      message: "A use-case transitively reaches a live adapter. It loads and saves through the repositories and clients the extension built and carries on the policy; a route from it to a live implementation, or to the extension that constructs them, means it would run against the real file system or git in a test."
      from: "@camp/modules/*/use-cases/**"
      fromNot: ["**/*.test.ts", "**/*.test-helper.ts"]
      to:
        - "@camp/modules/*/infrastructure/**/*-live.ts"
        - "@camp/infrastructure/campaign-functions.ts"
        - "@camp/infrastructure/report-source-live.ts"
        - "@camp/load/extension.ts"

    # The pack never names the matcher: a host composes the two, so a second
    # engine is a second package the pack need not know about.
    - name: pack-never-reaches-the-matcher
      message: "The language pack reaches no syntax matcher. The host composes the pack with one (`typescriptLanguage({ syntax })`), which is what lets a second engine arrive as a second package."
      from: "@ts/**"
      to: "@ag/**"

    - name: cli-never-reaches-the-plugin
      message: "The two hosts answer to the same core, never to each other — so an alpha plugin API is not a single point of failure for the CLI."
      from: "@cli/**"
      to: "@ox/**"

    - name: plugin-never-reaches-the-cli
      message: "The two hosts answer to the same core, never to each other — so the plugin carries nothing of the CLI's into a lint run."
      from: "@ox/**"
      to: "@cli/**"

    # The third host, held to the same line from both sides: the browsers
    # are composed over the core, not over the CLI's or the plugin's glue.
    - name: browser-never-reaches-another-host
      message: "The browser is a third host over the same core. It reaches neither the CLI nor the plugin, so a change to either host's glue cannot change what the browsers draw."
      from: "@br/**"
      to: ["@cli/**", "@ox/**"]

    - name: no-host-reaches-the-browser
      message: "Nothing reaches the browser but the browser. Its page carries React and a bundler; neither belongs in a lint run or a CLI check."
      from: ["@cli/**", "@ox/**", "@core/**", "@ts/**", "@ag/**", "@camp/**"]
      to: "@br/**"

    # The page runs in a browser: it may know the models' types and nothing
    # of the server, whose modules need Node.
    - name: page-reaches-no-server
      message: "The page reaches no server module, through any number of hops. It runs in a browser; the server needs Node."
      from: "@br/app/**"
      to: "@br/server/**"

# Fragments the tree below reuses, each by `use: <name>`. A key written beside
# `use` overrides the fragment's; a list is never merged, so a package that
# widens the floor spells the whole list out.
defs:
  # "Given facts, they return violations; they never read a file." Stated as a
  # rule about calls rather than about imports: an import allowlist stops
  # `node:fs` at the door, but a `readFileSync` handed in as a callback, or
  # reached through a helper, is the same violation with no edge to catch.
  no-file-system-calls:
    message: "`{name}` reads or writes the file system. This tier is given facts and returns violations; the file system is behind a port, and the port is what it takes."
    subject: calls
    match: ["*Sync", readFile, readdir, writeFile, require]
    probe:
      source: 'import { readFileSync } from "node:fs"; readFileSync("x");'
      name: readFileSync

  # The core's walker reads the disk as surely as readdirSync does, but under
  # a name no-file-system-calls cannot see. A campaigns tier that is handed
  # its files walks a tree through the WorkspaceClient instead.
  no-walker-calls:
    message: "`{name}` walks the disk: the core's walker is a live adapter. A use-case reads a tree through the WorkspaceClient on the policy's clients; the domain is handed the files."
    subject: calls
    match: [listSourceFiles, listWorkspaceProjects]
    probe:
      source: 'import { listSourceFiles } from "@goodbones/core"; listSourceFiles(".", [], []);'
      name: listSourceFiles

  # The floor every package inherits: node builtins, the runtime, and the test
  # framework. Each package adds the packages it may reach; none of them `reset`,
  # so this floor cannot be dropped further down.
  package-floor:
    external: [effect, vitest]
    allow: ["node:**", vitest.shared.ts]

  # No default exports. A default has no name to grep for, and every importer may
  # call it something different. The oxlint plugin entry is the one exception:
  # oxlint reads a plugin as a module's default.
  no-default-exports:
    message: "No default exports. A default has no name to grep for, and every importer may call it something different."
    kinds: [default]
    probe:
      source: "export default function main() {}"

  # A use-case and the domain answer with a result; saying it, or ending the
  # process, is the adapter's (docs/adr/0002-modules-of-use-cases-over-a-domain.md).
  # Ported from chernabog's policy.
  no-talking:
    message: "`{name}` talks to a person or ends the process. A use-case and the domain return a result and fail with tagged errors; the adapter that called them prints and sets the exit code."
    subject: calls
    match: [log, warn, error, info, exit]
    probe:
      source: 'export const zzUseCase = () => console.log("done");'
      name: log

  # A port is a declaration: the shape its adapters implement. A value beside
  # it is an implementation, which belongs in infrastructure/.
  port-declares-no-value:
    message: "A port declares a shape. `{name}` is a value: an implementation belongs in infrastructure/ behind the port."
    declares: [function, variable]
    probe:
      source: "export const zz = () => 1;"

  # A repository stores aggregates and reads them back; what they mean is the
  # domain's. A finder that answers a question, or a verb, is a rule that
  # belongs on the aggregate's ops.
  repository-vocabulary:
    message: 'Repository port member "{name}" is not in the persistence vocabulary: findAll, findOne, save and remove. Read the aggregates and let an op answer the question, or put the verb on the aggregate and have the use-case save the result.'
    subject: members
    declares: [type, interface]
    in: "*Repository*"
    allow: [findAll, findOne, save, remove]
    probe:
      source: "export type ZzRepository = { readonly pausedSlugs: () => void };"
      name: pausedSlugs

  # What a use-case file exports: the one use-case, named for it. Ported
  # from chernabog's policy.
  one-use-case-export:
    message: "A use-case file exports exactly one `<verbNoun>UseCase`. A second one is a second use-case that wants its own file; none means this isn't a use-case."
    declares: [function, variable]
    match: "*UseCase"
    count: { min: 1, max: 1 }
    probe:
      source: "export const zzUseCase = () => 1; export const yyUseCase = () => 2;"

  # A port is consumed by its module's domain and use-cases, by the adapter
  # that implements it, by the extension that builds the adapters and types
  # the policy over them, and by the barrel that publishes it.
  port-consumers:
    message: "A port is consumed by its module's domain and use-cases, the adapter that implements it, the extension that builds the adapters and the barrel. Anything else reaching for one is bypassing the use-case boundary: call a use-case instead."
    allow:
      - "@camp/modules/*/domain/**"
      - "@camp/modules/*/use-cases/**"
      - "@camp/modules/*/infrastructure/**"
      - "@camp/load/**"
      - "@camp/index.ts"
      - "**/*.test.ts"
      # An `importedBy` is matched against every importer the linter sees, and
      # oxlint lints e2e/ too; the harness is outside this policy's scope and
      # never imports a package's source.
      - "e2e/**"

  named-reexports-only:
    message: "Re-export by name, so a barrel says what the module is. `export *` takes every export at once and launders a restricted name through the barrel."
    kinds: [namespace]

# A package boundary is its barrel. Another package is reached by its published
# name, which resolves to `index.ts` (or `testing.ts`); a deep import into a
# sibling's `src/` is refused, as it would be for a consumer outside the repo.
#
# Each package's node is written beside the package it governs, and included
# here; this file stays the one index of what the policy reaches. Everything a
# node shares — the aliases, the `defs` it uses, the graph rules — is above.
tree:
  "~/core/": { include: packages/core/architecture.yaml }
  "~/typescript/": { include: packages/typescript/architecture.yaml }
  "~/ast-grep/": { include: packages/ast-grep/architecture.yaml }
  "~/campaigns/": { include: packages/campaigns/architecture.yaml }
  "~/cli/": { include: packages/cli/architecture.yaml }
  "~/oxlint/": { include: packages/oxlint/architecture.yaml }
  "~/browser/": { include: packages/browser/architecture.yaml }

# Migrations this repository is running, each tracked as an object: a
# detector, a rationale, a guide, a definition of done, and a ledger under
# `.architecture-campaigns/` of every place the pattern still occurs. The
# ledger only shrinks on its own; growth is recorded with a reason, or the
# build fails. This one is real — `manifest/` still throws where the rest of
# the loader returns a `Result` — and it is also the family's largest test:
# both hosts evaluate it against this tree on every lint run.
campaigns:
  lowering-reports-not-throws:
    title: Lowering reports through Result, not by throwing
    why: "`loadPolicy` returns a `Result`, but a manifest that lowers badly escapes it as a thrown `Error` — so a host that handles the failure value still has an exception to catch, and the message carries no line."
    how: "Return `Result.fail(new ConfigInvalid({ configPath, detail }))` from the lowering, threading the path the manifest was read from, and let `loadPolicy` pass it up. Keep the sentence; move it into `detail`."
    owner: "@dataquail"
    # Both lowerings: the core's, and the campaigns family's own, which
    # moved to its own package with the family. The two conceded throws went
    # with it, so widening the scope is what keeps them counted rather than
    # letting a package move read as progress.
    scope: ["@core/manifest/**", "@camp/manifest/**"]
    staleAfter: 90d
    onComplete: keep
    # The minimal campaign: one objective, no perimeter (the scope is its
    # one sector), no phases. What the family's first shape was.
    objectives:
      throws-in-lowering:
        intent: "A throw in the lowering is a failure `loadPolicy`'s caller cannot handle as a value."
        holdout: match
        match:
          all:
            - path: { file: "\\.ts$", fileNot: "\\.test\\.ts$" }
            - syntax: { pattern: "throw new Error($$$)" }
        probes:
          fires:
            - path: packages/core/src/manifest/zzprobe.ts
              source: 'const lower = () => { throw new Error("bad manifest"); };'
          ignores:
            - path: packages/core/src/manifest/zzprobe.test.ts
              source: 'const lower = () => { throw new Error("bad manifest"); };'
            - path: packages/core/src/manifest/zzprobe.ts
              source: "const lower = () => Result.fail(new ConfigInvalid({ configPath, detail }));"

  # The scalar form: a number per sector held to what `objectives clear` last
  # recorded, where the campaign above holds a list of places. The host glue
  # was one module that every verb, the nudge, the reports and the snapshot
  # grew into; split into use-cases, services and presenters, each file is a
  # sector held to its own non-blank lines, and a rise needs `objectives
  # concede --reason` in the open. Standing, not phased: a campaign with no
  # phases has its objectives in window everywhere.
  host-campaigns-shrinks:
    title: No campaigns host module grows past its count
    why: "`host/campaigns.ts` held evaluation, the ledger verbs, the nudge, the reports, history and explain in one module past two thousand lines, so every change to one verb was a review of all of them. The verbs are use-cases now, their rules domain services and their rendering presenters; what must not come back is one of them growing into the next `host/campaigns.ts`."
    how: "Keep a verb in its own use-case, a rule several verbs share in its own service, and a rendering in its own presenter. A file that must grow says why with `objectives concede host-campaigns-shrinks --sector <file> --reason`; one that shrinks is recorded smaller by `objectives clear host-campaigns-shrinks`."
    owner: "@dataquail"
    # Wherever the host glue landed: the verbs and the types they answer
    # with, the rules they share, the renderings, the git and shell adapters
    # host/diff.ts became, what a verb reads the policy through, and the
    # old names. One sector per file, each held to its own count; tests are
    # not glue, so compat/ is named by file.
    scope:
      - "@camp/modules/*/use-cases/*.use-case.ts"
      - "@camp/modules/*/use-cases/*.result.ts"
      - "@camp/modules/*/domain/services/*.service.ts"
      - "@camp/modules/*/infrastructure/clients/*.client-live.ts"
      - "@camp/presentation/*.presenter.ts"
      - "@camp/presentation/lines.ts"
      - "@camp/load/campaign-policy.ts"
      - "@camp/compat/policy-signatures.ts"
    perimeter: file
    staleAfter: 180d
    onComplete: keep
    objectives:
      host-lines:
        intent: "Every verb in one module is every verb in one review; a file's line count is how much of the next one it holds."
        measure: { lines: true }
        direction: down
        target: 1000
