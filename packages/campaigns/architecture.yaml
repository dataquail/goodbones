# yaml-language-server: $schema=https://dataquail.github.io/goodbones/schema/architecture-node.schema.json
#
# The @goodbones/campaigns node of the repository's architecture policy. The
# root architecture.yaml includes this file at `~/campaigns/`; the globals it
# shares — the aliases, the `defs` it uses, the graph rules — are written there.
message: "@goodbones/campaigns is a family the core does not own: a refactor as objectives over sectors through phases. It is laid out as the core is — a pure domain and core, its own two ports, the manifest slice it decodes, the extension a host composes, and the host glue the CLI drives — and it depends on the core and on nothing else in the repository."
layout: open
imports:
  use: package-floor
  message: "This import is not on this package's allowlist."
  # The floor, plus the two the family's own tests need: the YAML parser and
  # the validator, for the composed JSON Schema this package pins.
  external: [effect, vitest, yaml, ajv]
  allow:
    - "node:**"
    - vitest.shared.ts
    - "@core/index.ts"
    - "@core/testing.ts"
    - "@camp/**"
children:
  "src/":
    layout: open
    surface:
      - use: no-default-exports
      - use: named-reexports-only
    members:
      # The same rule the core carries, for the same reason: this is a
      # library, and a `console.log` in a plugin oxlint loads is noise in
      # every editor.
      - message: "`{name}` prints or exits. This package reports through values it returns; the CLI and the plugin decide what a reader sees, and whether the process goes on."
        subject: calls
        match: [log, warn, error, info, debug, trace, exit]
        probe:
          source: 'console.log("x");'
          name: log
    children:
      "domain/":
        message: "domain/ is the model: the lowered campaign vocabulary, and the diagnostics another program reported. No I/O, and nothing above it."
        layout: open
        children: {}
        members:
          - use: no-file-system-calls
        imports:
          message: "domain/ is the bottom of the graph. It reaches the core's barrel for the pattern primitives every family shares, itself, and the runtime."
          allow: ["@core/index.ts", "@camp/domain/**"]

      "ports/":
        message: "ports/ declares the two things this family must be given that the core's ports do not cover — a predicate function the host imported, and a source of another program's diagnostics."
        layout: open
        children: {}
        members:
          - message: 'A port member is a verb in camelCase: "{name}" is not. The port is the vocabulary every adapter must speak, and its case is part of the contract.'
            subject: members
            declares: [type, interface]
            allow: "[a-z]*"
            probe:
              source: "export type ReportSource = { readonly DiagnosticsOf: (file: string) => boolean };"
              name: DiagnosticsOf
        imports:
          message: "A port is a declaration. It may name the domain types that appear in its signatures, and nothing else."
          allow: ["@core/index.ts", "@camp/domain/**"]

      "core/":
        message: "core/ holds the pure evaluators — the detector, sectors, phases, the campaign's state over its files, and the ledger. Given facts, they return violations; they never read a file."
        layout: open
        children: {}
        members:
          - use: no-file-system-calls
        imports:
          message: "core/ evaluates. It reaches the core's barrel, this package's domain and ports, and its own siblings — never a live adapter, which is what lets every rule here be tested against a fake."
          allow:
            - "@core/index.ts"
            - "@core/testing.ts"
            - "@camp/domain/**"
            - "@camp/ports/**"
            - "@camp/core/**"
            - "@camp/infrastructure/*-fake.ts"
            # A sector's position is read off its record.
            - "@camp/modules/ledgers/domain/sector-record/**"

      "manifest/":
        message: "manifest/ is this family's slice of the manifest: the codec that decodes `campaigns` and `ledger`, and the lowering that resolves their globs with the same primitives the core's own lowering uses."
        layout: open
        children: {}
        imports:
          message: "Lowering is a transformation of the domain types. It reaches the core's barrel, this package's domain, and its own siblings; it does not evaluate, and it does not resolve."
          allow: ["@core/index.ts", "@camp/domain/**", "@camp/manifest/**"]

      "load/":
        message: "load/ is the extension a host composes into `loadPolicy`: decode this family's keys, lower them, compile and probe every rule, and read the ledgers through their repositories — which it builds over the host's file system port, as the family's composition point."
        layout: open
        children: {}
        members:
          - use: no-file-system-calls
        imports:
          message: "load/ composes this family's pure tiers. It reaches the core's barrel, the domain, the ports, the core and the manifest compiler, and the ledgers' domain and live repositories, which it builds; any other live adapter reaches it only as an argument."
          allow:
            - "@core/index.ts"
            - "@core/testing.ts"
            - "@camp/ports/**"
            - "@camp/core/**"
            - "@camp/manifest/**"
            - "@camp/load/**"
            - "@camp/modules/ledgers/domain/**"
            - "@camp/modules/ledgers/infrastructure/repositories/*-live.ts"
            - "@camp/modules/ledgers/infrastructure/repositories/ledger.mapper.ts"

      "infrastructure/":
        message: "infrastructure/ holds the fake for this family's report source, and the two things it does on this host: importing the `fn` terms' modules, and running a `report` term's command."
        layout: open
        children: {}
        imports:
          message: "An adapter implements a port. It reaches the port it satisfies, the domain types in that signature, and its own siblings."
          allow: ["@core/index.ts", "@camp/domain/**", "@camp/ports/**", "@camp/infrastructure/**"]

      "host/":
        message: "host/ is the glue a host drives: every campaign evaluated over the files it sees, the ledger verbs, the nudge over a real git diff, and the reports. It runs git and writes files, so it sits above the pure tiers and is reached only by a host."
        layout: open
        children: {}
        imports:
          message: "The host glue composes everything below it and the core's evaluators, which is how an `endState` is evaluated per sector."
          allow:
            - "@core/index.ts"
            - "@camp/domain/**"
            - "@camp/core/**"
            - "@camp/manifest/**"
            - "@camp/load/**"
            - "@camp/host/**"
            # The ledgers' rules, and — for the nudge, which reads HEAD's
            # ledgers through git rather than the file system — their codec.
            - "@camp/modules/ledgers/domain/**"
            - "@camp/modules/ledgers/infrastructure/repositories/*.mapper.ts"

      # The shape this package is moving to (docs/adr/0002-modules-of-use-cases-over-a-domain.md):
      # one folder per module — the aggregates goodbones owns and writes, the
      # ports its verbs load and save them through, and the adapters behind
      # those ports. The tiers beside this one empty into modules as they move.
      "modules/{module}/":
        message: "A module admits domain/ (its aggregates and the ports over them) and infrastructure/ (the adapters behind those ports)."
        name: kebab-case
        children:
          "domain/":
            message: "domain/ is a container: one folder per aggregate, named for it, and ports/ for the repositories the verbs load and save through. No files live directly in domain/."
            members:
              - use: no-talking
              - use: no-file-system-calls
            children:
              "ports/":
                message: "domain/ports/ is a container: repositories/, the module's own stores."
                children:
                  "repositories/":
                    imports:
                      reset: true
                      message: "A repository port is a declaration over its module's aggregates: it names them and effect, and nothing else."
                      external: [effect]
                      allow: ["@camp/modules/{module}/domain/**"]
                    children:
                      "*.repository.ts":
                        message: "A repository port needs its live adapter, its fake and the live adapter's test in ../../../infrastructure/repositories/."
                        surface: [{ use: port-declares-no-value }]
                        members: [{ use: repository-vocabulary }]
                        requires:
                          - "../../../infrastructure/repositories/{base}-live.ts"
                          - "../../../infrastructure/repositories/{base}-fake.ts"
                          - "../../../infrastructure/repositories/{base}-live.test.ts"

              # One folder per aggregate. ports/ above is matched first, so
              # this catch-all is only ever an aggregate.
              "{aggregate}/":
                message: "An aggregate's folder admits its root (*.root.ts), its operations (*.root-ops.ts, pure functions), its id (*.id.ts), its value objects (*.value-object.ts) and its errors (*.errors.ts). A free-standing helper is an op that hasn't found its root."
                imports:
                  reset: true
                  message: "An aggregate sees itself, the core's barrel and effect. It does not reach another aggregate or the ports: composing aggregates is a use-case's job. Until this package has a kernel, it may also name the old pure tiers (domain/, core/) for the primitives that still live there."
                  external: [effect]
                  allow:
                    - "@camp/modules/{module}/domain/{aggregate}/**"
                    - "@core/index.ts"
                    - "@camp/domain/**"
                    - "@camp/core/**"
                children:
                  # The folder is the aggregate, so its files carry its name.
                  "*.root.ts": { name: { like: "{aggregate}" } }
                  "*.root-ops.ts":
                    name: { like: "{aggregate}" }
                    message: "An aggregate's operations own its invariants, so they carry the test obligation: add the sibling *.root-ops.test.ts."
                    requires: ["{base}.test.ts"]
                  "*.id.ts": { name: { like: "{aggregate}" } }
                  "*.errors.ts": { name: { like: "{aggregate}" } }
                  "*.root-ops.test.ts":
                    imports:
                      message: "An aggregate's test names its subject, the old pure tiers it builds fixtures from, effect and the test framework."
                      external: [vitest]

          "infrastructure/":
            message: "infrastructure/ is a container mirroring domain/ports/: repositories/. No files live directly in infrastructure/."
            children:
              "repositories/":
                imports:
                  reset: true
                  message: "A repository adapts its module's aggregates to their storage — JSON under the ledger directory, read through the core's file system port. It names its module's domain, its sibling adapters, the core's barrel, the file system and effect; until this package has a kernel, the old core/ tier for the reserved sector names."
                  external: [effect]
                  allow:
                    - "node:**"
                    - "@core/index.ts"
                    - "@camp/modules/{module}/domain/**"
                    - "@camp/modules/{module}/infrastructure/**"
                    - "@camp/core/sectors.ts"
                children:
                  "*.repository-live.ts": {}
                  "*.repository-fake.ts": {}
                  "*.mapper.ts": {}
                  "*.repository-live.test.ts":
                    imports:
                      message: "A live repository's test drives it over a scratch directory: it names its module, the core's barrel, node, effect and the test framework."
                      external: [vitest]

      # The two barrels: the public surface, and the fake.
      "*.ts":
        imports:
          message: "A barrel re-exports the package's surface, so it names every tier."
          allow: ["@camp/**"]

  "**/": { layout: open, children: {} }
