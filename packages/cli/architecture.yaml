# yaml-language-server: $schema=https://dataquail.github.io/goodbones/schema/architecture-node.schema.json
#
# The @goodbones/cli node of the repository's architecture policy. The root
# architecture.yaml includes this file at `~/cli/`; the globals it shares —
# the aliases, the `defs` it uses, the graph rules — are written there.
message: "@goodbones/cli is one host: it reads the manifest file, constructs the language packs, and evaluates every family — including the graph family, which only an adapter seeing every file at once can — with no linter in the loop."
layout: open
imports:
  message: "A host composes the package. It reaches the core's barrels, the language pack's, the syntax matcher's and the campaigns family's — the last two only where it loads them as optional peers — and its own siblings, never the other host."
  # The floor, then this package's own.
  external: [effect, vitest]
  allow:
    - "node:**"
    - vitest.shared.ts
    - "@core/index.ts"
    - "@ts/index.ts"
    - "@ag/index.ts"
    - "@camp/index.ts"
    - "@cli/**"
  # The campaigns family and the syntax matcher are optional peers: a user who
  # never runs a campaign installs neither, and the bin must still load.
  deny:
    - match: "@camp/index.ts"
      except: ["@cli/campaigns/**", "**/*.test.ts"]
      message: "@goodbones/campaigns is an optional peer. Only src/campaigns/ names it, and the composition root reaches that folder through importOptional, so a repository without the package runs every other command."
    - match: "@ag/index.ts"
      except: ["@cli/config-loader.ts", "**/*.test.ts"]
      message: "@goodbones/ast-grep is an optional peer with a native binary. The composition root imports it through importOptional and composes it into the pack when it is there; nothing else names it."
children:
  "src/":
    layout: open
    children: {}
    members:
      # The CLI prints through one seam and fails through one value, so a
      # verb can be driven by a test that reads what it reported. Stated as a
      # rule about calls, so it holds in every module here, the tests included.
      - message: "`{name}` prints or exits. The CLI writes through output.ts's `report` and fails through a `CliFailure`; main.ts alone decides the exit code."
        subject: calls
        match: [log, warn, error, info, debug, trace, exit]
        probe:
          source: 'console.log("x");'
          name: log
    surface:
      - use: no-default-exports
      - use: named-reexports-only
  "**/": { layout: open, children: {} }
