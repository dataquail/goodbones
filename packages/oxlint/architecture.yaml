# yaml-language-server: $schema=https://dataquail.github.io/goodbones/schema/architecture-node.schema.json
#
# The @goodbones/oxlint node of the repository's architecture policy. The root
# architecture.yaml includes this file at `~/oxlint/`; the globals it shares —
# the aliases, the `defs` it uses, the graph rules — are written there.
message: "@goodbones/oxlint is the other host: six oxlint rules over the same manifest, evaluated one file at a time in the editor and in CI. It answers to the core, never to the CLI."
layout: open
imports:
  message: "A host composes the package. It reaches the core's barrels, the language pack's, the syntax matcher's and the campaigns family's — the last two only where it loads them as optional peers — the linter, and its own siblings — never the other host."
  # The floor, then this package's own.
  external: [effect, vitest, oxlint]
  allow:
    - "node:**"
    - vitest.shared.ts
    - "@core/index.ts"
    - "@core/testing.ts"
    - "@ts/index.ts"
    - "@ag/index.ts"
    - "@camp/index.ts"
    - "@ox/**"
  # The campaigns family and the syntax matcher are optional peers: a user who
  # never runs a campaign installs neither, and the plugin must still load.
  deny:
    - match: "@camp/index.ts"
      except: ["@ox/campaigns/**", "**/*.test.ts"]
      message: "@goodbones/campaigns is an optional peer. Only src/campaigns/ names it, and the composition root reaches that folder through importOptional, so a repository without the package lints with every other rule."
    - match: "@ag/index.ts"
      except: ["@ox/config-loader.ts", "**/*.test.ts"]
      message: "@goodbones/ast-grep is an optional peer with a native binary. The composition root imports it through importOptional and composes it into the pack when it is there; nothing else names it."
children:
  # The plugin entry is the one default export: oxlint reads a plugin
  # as a module's default. Everything else has a name to grep for.
  "src/":
    layout: open
    children: {}
    surface:
      - use: no-default-exports
        except: ["@ox/plugin.ts"]
      - use: named-reexports-only
  "**/": { layout: open, children: {} }
